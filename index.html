<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="HYBRID THEORY: plataforma de entrenamiento, programación y seguimiento del rendimiento deportivo."
    >

    <meta name="theme-color" content="#08090B">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HYBRID THEORY">

    <title>HYBRID THEORY | Training System</title>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="asset/logo.png" type="image/png">
    <link rel="apple-touch-icon" href="asset/logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Oswald:wght@500;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/variable.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/dashboard.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
</head>

<body>
    <noscript>
        <div class="noscript-message">
            JAVASCRIPT DESHABILITADO
            <p>
                HYBRID THEORY necesita JavaScript habilitado
                para funcionar correctamente.
            </p>
        </div>
    </noscript>

    <main id="app">
        <div class="initial-loader-container">
            <div class="loader"></div>
            <p class="initial-loader-text">
                HYBRID THEORY TRAINING SYSTEM
            </p>
        </div>
    </main>

    <div id="toast-container" aria-live="polite"></div>

    <script defer src="js/auth.js"></script>
    <script defer src="js/api.js"></script>
    <script defer src="js/app.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => {
                        console.log(
                            'Service Worker registrado:',
                            registration.scope
                        );

                        registration.addEventListener('updatefound', () => {
                            const newWorker = registration.installing;

                            if (newWorker) {
                                newWorker.addEventListener('statechange', () => {
                                    if (
                                        newWorker.state === 'installed' &&
                                        navigator.serviceWorker.controller
                                    ) {
                                        console.log(
                                            'Nueva versión de HYBRID THEORY disponible.'
                                        );
                                    }
                                });
                            }
                        });
                    })
                    .catch(error => {
                        console.error(
                            'Error al registrar el Service Worker:',
                            error
                        );
                    });
            });
        }
    </script>
</body>
</html>
